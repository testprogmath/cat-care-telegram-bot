{% macro icon(name) -%}
<svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'week' %}<rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path>
{%- elif name == 'meds' %}<rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"></rect><path d="M9.2 7.9l5.6 8.2"></path>
{%- elif name == 'foods' %}<path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"></path>
{%- elif name == 'refusals' %}<circle cx="12" cy="12" r="8.5"></circle><path d="M6 6l12 12"></path>
{%- elif name == 'person' %}<circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path>
{%- elif name == 'left' %}<path d="M15 6l-6 6 6 6"></path>
{%- elif name == 'right' %}<path d="M9 6l6 6-6 6"></path>
{%- endif %}</svg>
{%- endmacro %}
