services:
  bot:
    build: .
    image: skrypka-telegram-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    image: skrypka-telegram-bot
    command: care-api
    depends_on:
      - bot
    restart: unless-stopped
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
