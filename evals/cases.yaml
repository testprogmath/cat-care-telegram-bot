# Each case: the animal ("skripa" or "chipunya"), optionally tube: out, the message, and the
# events it must produce. Only the listed fields are compared; numbers within 1% or 0.05.
# Messages are written for this set or reduced from the chats to the words that matter:
# no names of people, places or sums of money.

- description: drinking time at the animal's own rate
  vars: {animal: skripa, text: "51сек пила водичку",
         expected: [{type: water, feeding: self, water_ml: 9.5}]}
- description: two drinking times are added
  vars: {animal: skripa, text: "Попила водичку 39+40секунд сама",
         expected: [{type: water, feeding: self, water_ml: 15}]}
- description: the other animal's rate
  vars: {animal: chipunya, text: "60 секунд пил водичку",
         expected: [{type: water, feeding: self, water_ml: 27}]}
- description: a worded estimate of drinking
  vars: {animal: skripa, text: "немного попила",
         expected: [{type: water, feeding: self, water_ml: 1}]}
- description: water given by people
  vars: {animal: skripa, text: "дала 10 мл воды",
         expected: [{type: water, feeding: tube, water_ml: 10}]}
- description: a subcutaneous infusion is water given by people
  vars: {animal: chipunya, text: "Ввели подкожно 32мл лактата рингера",
         expected: [{type: water, feeding: tube, water_ml: 32}]}
- description: a tube feed and the water after it
  vars: {animal: skripa, text: "Дала 18мл Royal Canin Recovery Liquid и 12мл воды",
         expected: [{type: food, feeding: tube, amount_ml: 18, kcal: 18},
                    {type: water, feeding: tube, water_ml: 12}]}
- description: given by syringe while the tube is out
  vars: {animal: skripa, tube: out, text: "дала 20 мл Recovery Liquid",
         expected: [{type: food, feeding: tube, amount_ml: 20}]}
- description: dry food by weight
  vars: {animal: skripa, text: "съела 5 г сухариков PurinaOne",
         expected: [{type: food, feeding: self, kcal: 18.5}]}
- description: two soups in one message, broth only
  vars: {animal: chipunya, text: "Съел (15+29)г двух разных супчиков Felix, без кусочков",
         expected: [{type: food, amount_ml: 15, kcal: 6.4, water_fraction: 0.95},
                    {type: food, amount_ml: 29, kcal: 12.3, water_fraction: 0.95}]}
- description: soup with nothing said about the bits is broth
  vars: {animal: chipunya, text: "Поел 17г супчика Феликс с курицей",
         expected: [{type: food, amount_ml: 17, kcal: 7.2, water_fraction: 0.95}]}
- description: a whole soup
  vars: {animal: chipunya, text: "съел весь супчик Felix с бифом",
         expected: [{type: food, amount_ml: 48, kcal: 23, water_fraction: 0.875}]}
- description: soup offered is not soup eaten
  vars: {animal: chipunya, text: "дала супчик Felix", expected: []}
- description: gravy of food with pieces, no volume
  vars: {animal: chipunya, text: "полизал подливку от Monge, кусочки не ел", expected: []}
- description: Felix Sauce with water and a leftover
  vars: {animal: skripa, text: "выпила Felix sauce с 20 мл воды, осталось 10г",
         expected: [{type: food, amount_ml: 50, kcal: 8.33}]}
- description: Felix Sensations with no share of pieces named counts as the usual mix
  vars: {animal: skripa, text: "съела 30 г Felix Sensations с уткой",
         expected: [{type: food, amount_ml: 30, kcal: 23.6, water_fraction: 0.842}]}
- description: Felix Sensations with a range of pieces uses its middle
  vars: {animal: skripa, text: "Скрипа съела 55 г Felix Sensations, из них примерно 10–15% кусочков",
         expected: [{type: food, amount_ml: 55, kcal: 31.1, water_fraction: 0.864}]}
- description: Felix Sensations gravy alone
  vars: {animal: chipunya, text: "вылизал 30 г подливки Felix Sensations",
         expected: [{type: food, amount_ml: 30, kcal: 12, water_fraction: 0.88}]}
- description: Felix Sensations as the usual mix
  vars: {animal: chipunya, text: "Съел 40 г Felix Sensations, обычная смесь",
         expected: [{type: food, amount_ml: 40, kcal: 31.5, water_fraction: 0.842}]}
- description: Felix Sensations with gravy and pieces weighed apart
  vars: {animal: skripa, text: "съела 20 г подливки и 5 г кусочков Felix Sensations",
         expected: [{type: food, amount_ml: 25, kcal: 16.6, water_fraction: 0.854}]}
- description: Felix Sensations from a pouch with a leftover, gravy only
  vars: {animal: chipunya, text: "из пауча Felix Sensations 85 г вылизал подливку, осталось 45 г",
         expected: [{type: food, amount_ml: 40, kcal: 16, water_fraction: 0.88}]}
- description: Felix Heerlijke Reepjes by weight
  vars: {animal: skripa, text: "съела 28 г Felix Heerlijke Reepjes Kip",
         expected: [{type: food, amount_ml: 28, kcal: 25, water_fraction: 0.786}]}
- description: a whole pouch of Heerlijke Reepjes, spelt Streepjes
  vars: {animal: chipunya, text: "съел весь пауч Felix Heerlijke Streepjes с уткой",
         expected: [{type: food, amount_ml: 85, kcal: 75.9, water_fraction: 0.786}]}
- description: Royal Canin Sensible by weight, not the unnamed dry food's 3.7 kcal/g
  vars: {animal: chipunya, text: "съел 3 г сухариков Royal Canin Sensible",
         expected: [{type: food, kcal: 12.9}]}
- description: Royal Canin Sensible counted in kibbles of 0.2 g
  vars: {animal: chipunya, text: "съел 20 сухариков Royal Canin Sensible 33",
         expected: [{type: food, kcal: 17.2}]}
- description: wet Purina One Junior by weight, not the dry Purina One
  vars: {animal: chipunya, text: "съел 14 г Purina One Kitten с курицей",
         expected: [{type: food, amount_ml: 14, kcal: 12.2, water_fraction: 0.78}]}
- description: the salmon Purina One Junior counts like the chicken one
  vars: {animal: skripa, text: "съела 34 г Purina One Junior с лососем и морковью",
         expected: [{type: food, amount_ml: 34, kcal: 29.6, water_fraction: 0.78}]}
- description: food put down and not eaten is a refusal, not a feeding
  vars: {animal: skripa, text: "насыпала 12 г, не ест", expected: [{type: refusal}]}
- description: a described stool gets its point on the scale
  vars: {animal: skripa, text: "покакала, стул жидкий, почти вода",
         expected: [{type: toilet, stool_score: 1}]}
- description: a normal formed stool is a 4
  vars: {animal: chipunya, text: "покакал, нормальная колбаска",
         expected: [{type: toilet, stool_score: 4}]}
- description: a stool with no consistency named has no score, so the bot asks
  vars: {animal: skripa, text: "покакала",
         expected: [{type: toilet, stool_score: null}]}
- description: Royal Canin Light Weight Care is a wet food at its label figures, even misspelt
  vars: {animal: skripa, text: "Скушала 60 грам важного корма Royal canin light weight care",
         expected: [{type: food, amount_ml: 60, kcal: 41.6, liquid: true, water_fraction: 0.82}]}
- description: subcutaneous fluids are water given by people, for a cat without a tube too
  vars: {animal: chipunya, text: "Дали подкожно 40мл лактата Рингера",
         expected: [{type: water, water_ml: 40, feeding: tube}]}
- description: adult Royal Canin Instinctive at its label figures, even misheard
  vars: {animal: skripa, text: "Съела 43 грамма жидкого корма Royal Canin Insertive",
         expected: [{type: food, amount_ml: 43, kcal: 33.4, liquid: true, water_fraction: 0.795}]}
- description: kitten Instinctive keeps the kitten figures
  vars: {animal: chipunya, text: "съел 40 г Royal Canin Kitten Instinctive",
         expected: [{type: food, amount_ml: 40, kcal: 38.1, liquid: true, water_fraction: 0.782}]}
- description: a counted toilet visit is that many events
  vars: {animal: skripa, text: "Ночью два раза пописала",
         expected: [{type: toilet}, {type: toilet}]}
- description: three visits
  vars: {animal: chipunya, text: "Пописал три раза за ночь",
         expected: [{type: toilet}, {type: toilet}, {type: toilet}]}
- description: a past dose only mentioned is not recorded
  vars: {animal: skripa, text: "вчера дала серению", expected: []}
- description: medication history is not recorded
  vars: {animal: skripa, text: "последняя доза была в четверг", expected: []}
- description: a past dose with its time is a late entry
  vars: {animal: skripa, text: "вчера в 23:30 дала серению 6 мг",
         expected: [{type: medication, name: серения, dose: "6 мг", days_ago: 1, time: "23:30"}]}
- description: a past dose the owner says was not written down is a late entry
  vars: {animal: skripa, text: "забыла написать: вчера дала серению 6 мг",
         expected: [{type: medication, name: серения, days_ago: 1}]}
- description: a brand name stays the brand, not its active substance
  vars: {animal: chipunya, text: "нанесла миратаз на правое ушко",
         expected: [{type: medication, name: миратаз}]}
- description: a past dose with a calendar date and time
  vars: {animal: skripa, text: "04.10 дала в 23:30 миратаз",
         expected: [{type: medication, name: миратаз, date: "04.10", time: "23:30"}]}
