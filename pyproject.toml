[project]
name = "skrypka-telegram-bot"
version = "0.1.0"
description = "Telegram bot that collects daily pet care statistics from group messages"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "openai>=1.100.0",
    "pydantic>=2.0",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "PyJWT[crypto]>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=7.1", "httpx2>=2.13", "ruff==0.16.10"]

[project.scripts]
skrypka-bot = "skrypka_bot.main:main"
care-export = "skrypka_bot.care_export:main"
care-api = "skrypka_bot.api:main"
care-web = "skrypka_bot.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skrypka_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Values always go through "?" placeholders; column names come from EDITABLE_COLUMNS.
"skrypka_bot/db.py" = ["S608"]
# urlopen only ever gets fixed https URLs of Telegram.
"skrypka_bot/web_auth.py" = ["S310"]
# Tests assert, use fake secrets, and build naive datetimes on purpose to test that path.
"tests/*" = ["S101", "S105", "S106", "S608", "DTZ"]
