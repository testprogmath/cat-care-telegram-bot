[project]
name = "skrypka-telegram-bot"
version = "0.1.0"
description = "Telegram bot that collects daily pet care statistics from group messages"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "openai>=1.100.0",
    "pydantic>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
skrypka-bot = "skrypka_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skrypka_bot"]
