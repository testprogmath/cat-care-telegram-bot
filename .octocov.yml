coverage:
  paths:
    - coverage.xml
  badge:
    path: badges/coverage.svg
codeToTestRatio:
  code:
    - "skrypka_bot/**/*.py"
  test:
    - "tests/**/*.py"
testExecutionTime:
  steps:
    - Run tests
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
