name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].labels[].name' || true)
          if grep -qx 'release:skip' <<<"$labels"; then
            echo "release:skip is set, nothing to release"
            exit 0
          fi
          if git tag --points-at "$SHA" | grep -q '^v'; then
            echo "$SHA is already released"
            exit 0
          fi
          last=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            tag=v1.0.0
          else
            IFS=. read -r major minor patch <<<"${last#v}"
            if grep -qx 'release:major' <<<"$labels"; then
              tag="v$((major + 1)).0.0"
            elif grep -qx 'release:minor' <<<"$labels"; then
              tag="v$major.$((minor + 1)).0"
            else
              tag="v$major.$minor.$((patch + 1))"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.tag != ''
        run: gh release create "${{ steps.version.outputs.tag }}" --target "$SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes

  deploy:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "${{ needs.release.outputs.tag }}"
