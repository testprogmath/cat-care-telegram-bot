name: Release label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  release-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name | select(test("^release:(major|minor|patch|skip)$"))')
          count=$(grep -c . <<<"$labels" || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Set exactly one label: release:major, release:minor, release:patch or release:skip. Found: ${labels:-none}"
            exit 1
          fi
          echo "Release label: $labels"
