name: Prompt eval

on:
  pull_request:
    paths:
      - skrypka_bot/parser.py
      - skrypka_bot/prompts/**
      - skrypka_bot/profiles.py
      - evals/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    environment: prompt-eval
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
      PROMPTFOO_PYTHON: python
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install --no-deps -e .
      - name: Run the parser on the regression set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        working-directory: evals
        run: npx -y promptfoo@0.124.1 eval -c promptfooconfig.yaml --no-cache --no-progress-bar -o results.json
      - name: Summarise the results
        if: ${{ !cancelled() && hashFiles('evals/results.json') != '' }}
        run: python evals/summary.py evals/results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('evals/results.json') != '' }}
        with:
          name: prompt-eval-results
          path: evals/results.json
          retention-days: 30
